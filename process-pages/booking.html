<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechConnect | Booking Request</title>
    <style>
        :root {
            --page-bg: #f3f5f8;
            --card-bg: #ffffff;
            --primary: #2a5df5;
            --primary-dark: #1f47d2;
            --title: #1b1d26;
            --text: #676d7a;
            --border: #dfe3ea;
            --field-bg: #f7f8fa;
            --shadow: 0 14px 34px rgba(15, 31, 66, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--page-bg);
            color: var(--title);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .page-shell {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .form-card {
            width: min(100%, 380px);
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 18px 18px 20px;
            border: 1px solid rgba(131, 142, 165, 0.08);
        }
       

        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #2a2d35;
            margin-bottom: 18px;
        }

        .step-badge {
            width: 22px;
            height: 22px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), #6ca1ff);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(42, 93, 245, 0.28);
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .brand-wrap {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
            color: #1d2330;
        }

        .brand-wrap img {
            width: 100%;
            height: fit-content;
        }



        .menu-button {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #f8f9fb;
            color: #8a8f98;
            font-size: 17px;
            cursor: pointer;
        }

        .heading {
            margin: 0;
            font-size: clamp(30px, 4vw, 36px);
            line-height: 1.08;
            letter-spacing: -0.06em;
            font-weight: 800;
            color:var(--title);
            margin-bottom: 8px;
        }

        .subtitle {
            margin: 0 0 20px;
            font-size: 12px;
            color: var(--text);
            line-height: 1.5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 12px;
            color: #1d2330;
        }

        .select-wrap,
        .field-wrap,
        .input-wrap {
            position: relative;
            margin-top: 8px;
        }

        select,
        input,
        textarea {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--field-bg);
            border-radius: 12px;
            color: #1b2430;
            font-size: 14px;
            padding: 12px 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus,
        input:focus,
        textarea:focus {
            border-color: rgba(42, 93, 245, 0.5);
            box-shadow: 0 0 0 4px rgba(42, 93, 245, 0.08);
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 38px;
            cursor: pointer;
        }

      

        .select-wrap::after {
            content: "▾";
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #0f4db0;
            font-size: 14px;
            pointer-events: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        textarea::placeholder,
        input::placeholder {
            color: #a2aab8;
        }

        .input-wrap input {
            padding-right: 38px;
        }

        .location-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--primary);
            pointer-events: none;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .date-row select {
            background: var(--field-bg);
        }

        .upload-box {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
            border: 1.5px dashed rgba(44, 72, 120, 0.25);
            background: #fbfbfd;
            border-radius: 12px;
            min-height: 48px;
            padding: 10px 12px;
            overflow: hidden;
        }

        .upload-box input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-box .upload-button {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e9eefb;
            color: #3364f4;
            font-weight: 600;
            border-radius: 10px;
            height: 32px;
            padding: 0 14px;
            font-size: 12px;
        }

        .upload-box .file-name {
            font-size: 12px;
            color: #8a919d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .submit-btn {
            margin-top: 8px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-radius: 12px;
            height: 46px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(42, 93, 245, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 28px rgba(42, 93, 245, 0.28);
        }

        @media (max-width: 420px) {
            .form-card {
                padding: 16px 14px 18px;
            }

            .heading {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="form-card">
            <div class="topbar">

            </div>

            <div class="brand-row">
                <div class="brand-wrap">
                    <img src="/assets/Icons/tech-connect-logo.svg" alt="">
                </div>
                <button class="menu-button" type="button" aria-label="Menu">
                    <img src="/assets/Icons/material-symbols--menu-rounded.svg" alt="">
                </button>
            </div>

            <h1 class="heading">Book a Repair Service</h1>
            <p class="subtitle">Tell us about your issue and we'll match you with the best technician.</p>

            <form>
                <label>
                    Service Category
                    <div class="select-wrap">
                        <select aria-label="Service Category">
                            <option selected>Electrical Repair</option>
                            <option>Plumbing</option>
                            <option>Carpentry</option>
                            <option>Painting</option>
                            <option>Air Conditioning</option>
                            <option>Telecom</option>
                            <option>IT Support</option>
                        </select>
                    </div>
                </label>

                <label>
                    Problem Description
                    <textarea aria-label="Problem Description" placeholder="Describe the issue in detail..."></textarea>
                </label>

                <label>
                    Address
                    <div class="input-wrap">
                        <input type="text" aria-label="Address" placeholder="Enter your address" />
                        <span class="location-icon" aria-hidden="true">⌖</span>
                    </div>
                </label>

                <label>
                    Preferred Date &amp; Time
                    <div class="date-row">
                        <div class="field-wrap">
                            <select aria-label="Preferred date">
                                <option selected>Select date</option>
                                <option>Today</option>
                                <option>Tomorrow</option>
                                <option>This week</option>
                            </select>
                        </div>
                        <div class="field-wrap">
                            <select aria-label="Preferred time">
                                <option selected>Select time</option>
                                <option>9:00 AM</option>
                                <option>12:00 PM</option>
                                <option>3:00 PM</option>
                                <option>6:00 PM</option>
                            </select>
                        </div>
                    </div>
                </label>

                <label>
                    Add Photos (Optional)
                    <div class="upload-box">
                        <span class="upload-button">Choose files</span>
                        <span class="file-name">No file chosen...</span>
                        <input type="file" aria-label="Add Photos" multiple />
                    </div>
                </label>

                <button type="submit" class="submit-btn">Submit Request</button>
            </form>
        </div>
    </div>
</body>
</html>
