<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechConnect | Quotation & Payment</title>
    <style>
        :root {
            --bg: #f2f5fb;
            --card: #ffffff;
            --primary: #2d5ef4;
            --primary-strong: #224fe0;
            --title: #171d2a;
            --muted: #6f7787;
            --line: #e8edf4;
            --field: #f7f8fb;
            --soft-blue: #edf3ff;
            --green: #18b76c;
            --shadow: 0 18px 40px rgba(18, 30, 72, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--title);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .page-shell {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .quote-card {
            width: min(100%, 360px);
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 16px 18px 18px;
            border: 1px solid rgba(130, 147, 176, 0.08);
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            font-weight: 700;
            font-size: 12px;
            color: var(--title);
        }

        .step-badge {
            width: 22px;
            height: 22px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), #7ca2ff);
            color: white;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 10px 22px rgba(45, 94, 244, 0.2);
        }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .brand img {
            display: block;
            width: 100px;
            height: fit-content;
        }

        .brand-mark {
            width: 16px;
            height: 16px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--primary), #7aa1ff);
            position: relative;
            display: inline-block;
        }

        .brand-mark::before {
            content: "";
            position: absolute;
            inset: 3px;
            border: 2px solid rgba(255,255,255,0.9);
            border-radius: 50%;
        }

        .icon-group {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #7d8798;
            font-size: 15px;
        }

        .icon-box {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--field);
            display: grid;
            place-items: center;
        }

        .title {
            margin: 0 0 14px;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .quote-box {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
            overflow: hidden;
        }

        .quote-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            font-size: 13px;
            color: var(--title);
        }

        .quote-row + .quote-row {
            border-top: 1px solid var(--line);
        }

        .quote-row .label {
            color: #4d5463;
        }

        .quote-row .value {
            font-weight: 700;
        }

        .quote-row.total {
            background: #fafbff;
            font-size: 14px;
            font-weight: 800;
        }

        .quote-row.total .value {
            color: var(--title);
            font-size: 15px;
        }

        .payment-title {
            margin: 18px 0 10px;
            font-size: 13px;
            font-weight: 800;
            color: var(--title);
        }

        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: white;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--title);
        }

        .radio {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #c7cfdd;
            display: inline-block;
            position: relative;
            background: white;
        }

        .option.selected {
            border-color: rgba(45, 94, 244, 0.35);
            background: rgba(45, 94, 244, 0.02);
        }

        .option.selected .radio {
            border-color: var(--primary);
        }

        .option.selected .radio::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--primary);
        }

        .pay-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .chip {
            min-width: 28px;
            height: 18px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
            padding: 0 6px;
        }

        .chip.visa { background: linear-gradient(135deg, #1a57d8, #5da3ff); }
        .chip.master { background: linear-gradient(135deg, #ff9a00, #ff5f5f); }
        .chip.momo { background: linear-gradient(135deg, #d6216d, #ff79aa); }
        .chip.bank { background: linear-gradient(135deg, #0f9d8d, #60d7c2); }

        .accept-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: white;
            font-weight: 700;
            font-size: 15px;
            padding: 14px 16px;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(45, 94, 244, 0.22);
        }

        .terms {
            margin-top: 10px;
            text-align: center;
            font-size: 10px;
            line-height: 1.5;
            color: var(--muted);
        }

        .terms a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 380px) {
            .quote-card {
                padding-left: 14px;
                padding-right: 14px;
            }

            .quote-row {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="quote-card">
            <div class="topbar">
                <div class="step-badge">3</div>
                <span>Quotation and Payment Page</span>
            </div>

            <div class="brand-row">
                <div class="brand">
                    <img src="/assets/Icons/tech-connect-logo.svg" alt="Tech Connect logo" width="16" height="16">
                </div>
                <div class="icon-group" aria-label="Settings and notifications">
                    <span class="icon-box">
                        <img src="/assets/Icons/andrsrxn--settings.svg" alt="Settings" width="12" height="12">
                    </span>
                </div>
            </div>

            <h2 class="title">Quotation for Repair Service</h2>

            <div class="quote-box">
                <div class="quote-row">
                    <span class="label">Labour (2 hrs)</span>
                    <span class="value">$60.00</span>
                </div>
                <div class="quote-row">
                    <span class="label">Materials</span>
                    <span class="value">$35.00</span>
                </div>
                <div class="quote-row">
                    <span class="label">Service Fee</span>
                    <span class="value">$5.00</span>
                </div>
                <div class="quote-row total">
                    <span>Total Estimate</span>
                    <span class="value">$90.00</span>
                </div>
            </div>

            <div class="payment-title">Payment Method</div>

            <div class="payment-options">
                <div class="option selected">
                    <div class="option-left">
                        <span class="radio" aria-hidden="true"></span>
                        <span>Credit/Debit Card</span>
                    </div>
                    <div class="pay-icons">
                        <span class="chip visa">VISA</span>
                        <span class="chip master">MC</span>
                    </div>
                </div>

                <div class="option">
                    <div class="option-left">
                        <span class="radio" aria-hidden="true"></span>
                        <span>Mobile Money</span>
                    </div>
                    <div class="pay-icons">
                        <span class="chip momo">MOMO</span>
                    </div>
                </div>

                <div class="option">
                    <div class="option-left">
                        <span class="radio" aria-hidden="true"></span>
                        <span>Bank Transfer</span>
                    </div>
                    <div class="pay-icons">
                        <span class="chip bank">BANK</span>
                    </div>
                </div>
            </div>

            <button class="accept-btn" type="button">Accept &amp; Pay</button>

            <div class="terms">
                By accepting, you agree to our <a href="#">Terms and Conditions</a>.
            </div>
        </div>
    </div>
</body>
</html>
