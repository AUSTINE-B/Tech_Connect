<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechConnect | Technician Profile</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --panel: #ffffff;
            --soft: #f7f9fc;
            --primary: #2d5ef4;
            --primary-dark: #234fe0;
            --title: #1a1f2d;
            --muted: #717d90;
            --line: #e8edf4;
            --shadow: 0 18px 42px rgba(17, 27, 49, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--title);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .page-shell {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .profile-page {
            width: min(100%, 420px);
            background: var(--panel);
            border-radius: 22px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(132, 145, 172, 0.08);
            padding: 16px 16px 18px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dfe9ff, #bdd1ff);
            display: grid;
            place-items: center;
            font-weight: 800;
            color: #234a7b;
            position: relative;
            border: 2px solid rgba(45, 94, 244, 0.08);
        }

        .avatar::before {
            content: "";
            position: absolute;
            right: 2px;
            bottom: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid white;
        }

        .name-wrap {
            display: flex;
            flex-direction: column;
        }

        .name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .verified {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
        }

        .verified::before {
            content: "✓";
            display: inline-grid;
            place-items: center;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 10px;
        }

        .rating-box {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .star {
            color: #f6b535;
            font-size: 12px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: white;
            color: var(--primary);
            font-size: 18px;
        }

        .book-btn {
            margin-top: 14px;
            width: 100%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(45, 94, 244, 0.2);
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 16px;
            margin-bottom: 14px;
        }

        .tab {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--soft);
            text-align: center;
            padding: 9px 8px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
        }

        .tab.active {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: rgba(45, 94, 244, 0.18);
        }

        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }

        .detail-item {
            display: grid;
            grid-template-columns: 30px 1fr;
            gap: 10px;
            align-items: start;
        }

        .item-icon {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            background: #edf3ff;
            color: var(--primary);
            display: grid;
            place-items: center;
            font-size: 14px;
        }

        .detail-item .label {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .detail-item .value {
            font-size: 12px;
            font-weight: 700;
            color: var(--title);
        }

        .meta-wrap {
            display: flex;
            gap: 8px;
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
        }

        .meta-wrap span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        @media (max-width: 420px) {
            .profile-page {
                padding-left: 12px;
                padding-right: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="profile-page">
            <div class="profile-header">
                <div class="user-info">
                    <div class="avatar" aria-label="David Mensah profile photo">DM</div>
                    <div class="name-wrap">
                        <div class="name">David Mensah</div>
                        <div class="verified">Verified</div>
                        <div class="rating-box"><span class="star">★</span> <span>4.8</span> <span>(124 reviews)</span></div>
                    </div>
                </div>

                <div class="contact-btn" aria-label="Contact technician">☎</div>
            </div>

            <button class="book-btn" type="button">Book Now</button>

            <div class="tabs" aria-label="Profile tabs">
                <div class="tab active">About</div>
                <div class="tab">Services</div>
                <div class="tab">Reviews</div>
            </div>

            <div class="detail-list">
                <div class="detail-item">
                    <div class="item-icon">⏱</div>
                    <div>
                        <div class="label">Experience</div>
                        <div class="value">8+ years</div>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="item-icon">✓</div>
                    <div>
                        <div class="label">Certifications</div>
                        <div class="value">Electrical Safety Certificate</div>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="item-icon">◎</div>
                    <div>
                        <div class="label">Service Area</div>
                        <div class="value">Accra and surrounding areas</div>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="item-icon">◌</div>
                    <div>
                        <div class="label">Languages</div>
                        <div class="value">English, Twi</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
